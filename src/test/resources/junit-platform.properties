cucumber.publish.quiet=true
cucumber.publish.enabled=false

# Both engines' parallel-execution flags are pinned off: junit.jupiter.execution.parallel.enabled
# only covers the Jupiter engine (offline unit tests), and SmokeTestRunner runs through the
# separate Cucumber JUnit-Platform engine, which has its own independent parallel-execution key.
# BrowserResources is not thread-safe by design (see docs/architecture.md) — this is a baseline
# default only; a system property still takes precedence over this file per JUnit Platform's own
# configuration-parameter resolution, which is why qaSmokeTest additionally pins
# cucumber.execution.parallel.enabled as a non-overridable systemProperty in build.gradle.
junit.jupiter.execution.parallel.enabled=false
cucumber.execution.parallel.enabled=false
