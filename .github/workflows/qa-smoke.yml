name: QA Smoke (manual)

# Manual only: no push/PR/schedule trigger. This workflow loads the master QA landing page — it
# must never gain a scheduled trigger, and the scenario it runs must never create a user or
# submit a payment (see docs/checkout-testing.md and docs/payment-safety.md).
on:
  workflow_dispatch: {}

jobs:
  smoke:
    name: QA smoke against master QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Chromium for Playwright
        run: >
          ./mvnw -q -B org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run QA smoke suite
        run: ./mvnw -B test -Dtest=SmokeTestRunner

      # Uploaded regardless of pass/fail, but the smoke scenario itself never retries on
      # failure — see docs/payment-safety.md on why this framework never auto-retries.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-artifacts
          path: |
            target/artifacts/**
            target/cucumber-report/**
            target/surefire-reports/**
          if-no-files-found: ignore
