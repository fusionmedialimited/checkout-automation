name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Compile and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No browser is installed and no network target is touched here on purpose: `test` only
      # runs plain *Test classes (see build.gradle / docs/architecture.md). Anything that opens a
      # browser lives in the separate, manual qa-smoke workflow.
      - name: Compile and run offline tests
        run: ./gradlew test
