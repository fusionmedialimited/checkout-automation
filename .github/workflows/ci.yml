name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Compile and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No browser is installed and no network target is touched here on purpose: `mvn test`
      # only runs plain *Test.java classes (see pom.xml / docs/architecture.md). Anything that
      # opens a browser lives in the separate, manual qa-smoke workflow.
      - name: Compile and run offline tests
        run: ./mvnw -B test
